<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking — Admin ZANSTDO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/style.css">
<link rel="stylesheet" href="../CSS/responsive.css">
<link rel="stylesheet" href="../CSS/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-side">
    <div class="admin-brand">ZANSTDO<span>Studio Manager</span></div>
    <nav class="admin-nav">
      <a href="index.html">📊 Dashboard</a>
      <a href="bookings.html" class="active">📋 Bookings</a>
      <a href="gallery.html">🖼️ Galeri & Favorit</a>
      <a href="orders.html">🛍️ Pesanan</a>
    </nav>
    <div class="admin-foot">
      <a href="../index.html">← Lihat Website</a>
    </div>
  </aside>

  <!-- Konten -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Kelola Booking</h1>
        <p>Geser status booking antar kolom sesuai progres pekerjaan.</p>
      </div>
    </div>

    <div class="board">
      <div class="board-col" id="col-pending">
        <h3><span>⏳ Pending</span><span class="col-count badge status-pending">0</span></h3>
        <div class="board-body"></div>
      </div>
      <div class="board-col" id="col-confirmed">
        <h3><span>✅ Confirmed</span><span class="col-count badge status-confirmed">0</span></h3>
        <div class="board-body"></div>
      </div>
      <div class="board-col" id="col-completed">
        <h3><span>🎉 Completed</span><span class="col-count badge status-completed">0</span></h3>
        <div class="board-body"></div>
      </div>
    </div>

    <p class="muted-text small" style="margin-top: 18px;">
      Klik <strong>Invoice</strong> atau <strong>Kontrak</strong> pada kartu booking untuk melihat pratinjau dokumen.
    </p>
  </main>

</div>

<script src="../JAVASCRIPT/storage.js"></script>
<script src="../JAVASCRIPT/data.js"></script>
<script src="../JAVASCRIPT/app.js"></script>
<script src="../JAVASCRIPT/admin.js"></script>
</body>
</html>
